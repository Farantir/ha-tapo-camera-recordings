services:
  tapo-viewer:
    build: .
    image: tapo-viewer:latest
    # Without this, `docker compose up -d` skips the build whenever the tag
    # already exists locally — so a redeploy after a git pull silently keeps
    # running the old code. "build" makes Compose rebuild every single time;
    # Docker's layer cache keeps that near-instant when nothing changed, and
    # a changed COPY layer invalidates the cache on its own.
    pull_policy: build
    container_name: ${CONTAINER_NAME:-tapo-viewer}
    restart: ${RESTART_POLICY:-unless-stopped}
    # uid:gid the process runs as. A bind mount keeps its host ownership,
    # so this has to be a user that can read TAPO_HOST_PATH. Defaults to
    # the image's own non-root "deno" user.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      # BIND_ADDRESS 0.0.0.0 exposes the port on every interface; narrow it to a
      # LAN address if the host also faces the internet.
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8123}:8000"
    volumes:
      # TAPO_HOST_PATH is your tapo backup folder on the Docker host.
      - ${TAPO_HOST_PATH:-/volume1/tapo}:/data:ro
    environment:
      # set that to your local timezone as tapo uses that for its timestamps
      DISPLAY_TZ: ${DISPLAY_TZ:-Europe/Berlin}
      TS_OFFSET_SECONDS: "${TS_OFFSET_SECONDS:--3600}"
      RESCAN_INTERVAL_S: "${RESCAN_INTERVAL_S:-1800}"
      # Shared login password. Leave empty and the viewer stays wide open.
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      SESSION_TTL_S: "${SESSION_TTL_S:-43200}"
      # Set to keep people logged in across restarts; empty means a new random
      # key each start, which signs everyone out.
      AUTH_SECRET: ${AUTH_SECRET:-}
