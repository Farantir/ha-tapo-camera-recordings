services:
  tapo-viewer:
    build: .
    image: tapo-viewer:latest
    # Without this, `docker compose up -d` skips the build whenever the tag
    # already exists locally — so a redeploy after a git pull silently keeps
    # running the old code. "build" makes Compose rebuild every single time;
    # Docker's layer cache keeps that near-instant when nothing changed, and
    # a changed COPY layer invalidates the cache on its own.
    pull_policy: build
    container_name: ${CONTAINER_NAME:-tapo-viewer}
    restart: ${RESTART_POLICY:-unless-stopped}
    # uid:gid the process runs as. A bind mount keeps its host ownership,
    # so this has to be a user that can read TAPO_HOST_PATH. Defaults to
    # the image's own non-root "deno" user.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      # BIND_ADDRESS 0.0.0.0 exposes the port on every interface; narrow it to a
      # LAN address if the host also faces the internet.
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8123}:8000"
    volumes:
      # TAPO_HOST_PATH is your tapo backup folder on the Docker host.
      - ${TAPO_HOST_PATH:-/volume1/tapo}:/data:ro
      # The tagger writes here, the viewer only reads. This is the one channel
      # between them; the footage mount stays read-only for both. It carries
      # the sidecar and the thumbnails the tagger cuts from each event, which
      # the viewer shows in place of the camera's own stills.
      - tags:/tags:ro
    environment:
      # set that to your local timezone as tapo uses that for its timestamps
      DISPLAY_TZ: ${DISPLAY_TZ:-Europe/Berlin}
      TS_OFFSET_SECONDS: "${TS_OFFSET_SECONDS:--3600}"
      RESCAN_INTERVAL_S: "${RESCAN_INTERVAL_S:-1800}"
      # Where to look for the tagger's output. Unset it to turn tags off.
      TAGS_FILE: "${TAGS_FILE:-/tags/tags.json}"
      # Shared login password. Leave empty and the viewer stays wide open.
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      SESSION_TTL_S: "${SESSION_TTL_S:-43200}"
      # Set to keep people logged in across restarts; empty means a new random
      # key each start, which signs everyone out.
      AUTH_SECRET: ${AUTH_SECRET:-}

  # Analyses each recording and writes /tags/tags.json. Optional: leave it out
  # and the viewer simply shows no tag filters.
  #
  # It is deliberately not part of the viewer's image — the models are ~340 MB
  # and only this service needs ffmpeg, numpy and ONNX Runtime.
  tapo-tagger:
    build: ./tagger
    image: tapo-tagger:latest
    pull_policy: build
    container_name: ${TAGGER_CONTAINER_NAME:-tapo-tagger}
    restart: ${TAGGER_RESTART_POLICY:-unless-stopped}
    # Same uid as the viewer so both can reach the footage; the tagger also
    # needs to write /tags and /models.
    user: "${PUID:-1000}:${PGID:-1000}"
    # The tagger needs the network exactly once, to download the models into
    # the /models volume on first start. Everything after that — decoding,
    # detection, classification — is local. Once `docker compose logs
    # tapo-tagger` has shown "models ready", uncomment the next line and
    # recreate the service to cut it off from the network for good; the
    # download step then sees the files already present and skips.
    # network_mode: none
    volumes:
      - ${TAPO_HOST_PATH:-/volume1/tapo}:/data:ro
      - tags:/tags
      # Models are downloaded once on first start and kept here, so a restart
      # or an image rebuild does not re-fetch them.
      - models:/models
    environment:
      # 0 runs one pass and exits; anything else re-checks on that interval.
      # A few new recordings a day means there is nothing to do most passes.
      INTERVAL_S: "${TAGGER_INTERVAL_S:-3600}"
      # Detector size trades accuracy for time: yolov10n (9 MB) is roughly ten
      # times quicker than yolov10x (118 MB) and noticeably worse on small,
      # distant animals. Changing this re-tags nothing by itself — delete
      # tags.json, or bump the files, to force a re-analysis.
      DETECTOR: "${TAGGER_DETECTOR:-yolov10x}"
      # Frames per clip handed to the detector. The motion scan looks at all of
      # them and picks these; more frames means a better chance of catching a
      # two-second visit, at a linear cost.
      MAX_FRAMES: "${TAGGER_MAX_FRAMES:-24}"
      # Half those frames go to the busiest moments in the clip. This is how
      # far apart two of them have to be, in seconds — without a gap they all
      # land on the same second, because motion rises and falls smoothly.
      PEAK_GAP_S: "${TAGGER_PEAK_GAP_S:-2.0}"
      # How much of the probability mass a taxon needs before the tag descends
      # to it. Lower means more species names and more mistakes; higher means
      # more events labelled just "animal" or a family.
      SPECIES_CONF: "${TAGGER_SPECIES_CONF:-0.55}"
      # --- how eager the tagger is to call something an event ---------------
      # Between them these four decide whether a clip is a sighting or
      # no_event. Lower values catch more of the brief, distant and blurred
      # visitors at the cost of the odd branch tagged as wildlife.
      #   DETECT_CONF           a box has to score this to be looked at at all
      #   TRUST_DETECTOR        above this the detector's own class stands even
      #                         when the species classifier calls the crop blank
      #   STRONG_SCORE          one frame is enough for a person or a vehicle
      #   STRONG_SCORE_WILDLIFE the same for an animal, held higher because a
      #                         lone weak box in a hedge is usually a branch
      DETECT_CONF: "${TAGGER_DETECT_CONF:-0.25}"
      TRUST_DETECTOR: "${TAGGER_TRUST_DETECTOR:-0.35}"
      STRONG_SCORE: "${TAGGER_STRONG_SCORE:-0.45}"
      STRONG_SCORE_WILDLIFE: "${TAGGER_STRONG_SCORE_WILDLIFE:-0.75}"
      # Cap ONNX Runtime's threads on a small box so tagging does not starve
      # the viewer. 0 lets it decide.
      THREADS: "${TAGGER_THREADS:-0}"
      LOG_LEVEL: "${TAGGER_LOG_LEVEL:-INFO}"

volumes:
  tags:
  models:
