<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Tapo Events</title>
    <link rel="stylesheet" href="/login.css">
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📹</text></svg>"
    >
  </head>
  <body class="login-body">
    <main class="login-card">
      <h1>📹 Tapo Events</h1>
      <p class="login-hint">This viewer is password protected.</p>
      <form id="login-form" autocomplete="on">
        <label class="sr-only" for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          required
          autofocus
        >
        <button id="submit" type="submit">Sign in</button>
      </form>
      <p id="error" class="login-error" role="alert"></p>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>
